<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Certificate</title>
    <style>
        body { background: #2c3e50; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Georgia', serif; }
        .cert-wrapper { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 750px; }
        .certificate { border: 8px double #1a3b5d; padding: 40px; text-align: center; background: #fefefe; position: relative; }
        .header { font-size: 14px; color: #1a3b5d; letter-spacing: 2px; font-weight: bold; }
        .title { font-size: 36px; color: #1a3b5d; margin: 20px 0; text-transform: uppercase; letter-spacing: 3px; border-bottom: 2px solid #1a3b5d; display: inline-block; padding-bottom: 10px; }
        .subtitle { font-size: 18px; color: #555; margin: 20px 0; }
        .name { font-size: 42px; color: #000; margin: 20px 0; font-weight: bold; }
        .text { font-size: 16px; color: #444; line-height: 1.6; }
        .footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 40px; padding-top: 20px; border-top: 2px solid #ddd; }
        .signature { text-align: center; }
        .signature p { margin: 0; font-size: 12px; color: #666; }
        .signature-line { width: 150px; height: 1px; background: #333; margin: 5px auto 10px; }
        #barcode { margin-top: 20px; width: 100%; display: flex; justify-content: center; }
    </style>
</head>
<body>
    <div class="cert-wrapper">
        <div class="certificate">
            <div class="header">SCHOOL APP SPECIMEN LOG</div>
            <div class="title">Certificate of Completion</div>
            <div class="subtitle">This is to certify that</div>
            <div class="name" id="student-name">Student Name Here</div>
            <div class="text">Has successfully completed the daily practice quiz and demonstrated excellence in NEET Biology & CA Foundations.</div>
            
            <div class="footer">
                <div class="signature">
                    <div class="signature-line"></div>
                    <p><strong>CEO & Founder</strong><br>Suhail Yousuf</p>
                </div>
                <div class="signature">
                    <div class="signature-line"></div>
                    <p><strong>Co-Founder</strong><br>Ibraheem</p>
                </div>
            </div>
            
            <!-- Barcode Generation -->
            <div id="barcode">
                <img src="https://barcode.tec-it.com/barcode.ashx?data=VERIFIED-SCHOOL-APP-2026&code=Code128&dpi=96" alt="Verification Barcode">
            </div>
            <p style="font-size: 10px; color: #999; margin-top: 10px;">Scan barcode to verify authenticity</p>
        </div>
    </div>
</body>
</html>
