<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA Daily Practice Mock</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 700px; width: 100%; background: white; padding: 30px; border-radius: 15px; }
        h1 { color: #2c3e50; text-align: center; }
        .question-box { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #2980b9; }
        .q-text { font-weight: bold; margin-bottom: 10px; }
        .options label { display: block; padding: 8px; background: white; margin: 5px 0; border-radius: 5px; border: 1px solid #ddd; cursor: pointer; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 20px; }
        #result { text-align: center; font-size: 20px; font-weight: bold; color: #2980b9; display: none; margin-top: 20px; }
        .back-btn { display: block; text-align: center; margin-top: 15px; color: #7f8c8d; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 CA Daily Practice Mock</h1>
        <p style="text-align:center; color:#7f8c8d;">10 Random Questions Every Day</p>
        <div id="questions-area"></div>
        <button onclick="submitQuiz()">Submit & Check Score</button>
        <div id="result"></div>
        <a href="index.html" class="back-btn">⬅ Back to Main Quiz</a>
    </div>

    <script>
        const caBank = [
            { q: "What is the basic accounting equation?", o: ["Assets = Liabilities + Equity", "Assets + Liabilities = Equity", "Income = Expenses", "Assets = Revenue"], a: 0 },
            { q: "Which of the following is a current asset?", o: ["Land", "Building", "Cash", "Patent"], a: 2 },
            { q: "What does GST stand for?", o: ["Goods and Services Tax", "Global Sales Tax", "General Service Tax", "Government Sales Tax"], a: 0 },
            { q: "Depreciation is calculated on which value?", o: ["Market Value", "Book Value", "Selling Price", "Cost Price"], a: 1 },
            { q: "Which financial statement shows profitability?", o: ["Balance Sheet", "P&L Account", "Cash Flow", "Trial Balance"], a: 1 },
            { q: "What is the full form of ICAI?", o: ["Institute of Chartered Accountants of India", "Indian Council of Accounting", "International CA Institute", "Institute of Corporate Auditors"], a: 0 },
            { q: "Which of these is a liability?", o: ["Machinery", "Bank Loan", "Stock", "Cash"], a: 1 },
            { q: "Double Entry system was invented by?", o: ["Luca Pacioli", "Adam Smith", "John Maynard", "Peter Drucker"], a: 0 },
            { q: "What is the rule of Debit/Credit for an Asset?", o: ["Debit decreases, Credit increases", "Debit increases, Credit decreases", "Both increase", "Both decrease"], a: 1 },
            { q: "Which Act governs auditing in India?", o: ["Companies Act 2013", "Income Tax Act", "GST Act", "SEBI Act"], a: 0 },
            { q: "Working Capital equals?", o: ["Current Assets - Current Liabilities", "Fixed Assets - Fixed Liabilities", "Total Assets - Total Liabilities", "Revenue - Expenses"], a: 0 },
            { q: "What is a 'Sundry Debtor'?", o: ["A person who owes money", "A person who is paid money", "A fixed asset", "An intangible asset"], a: 0 },
            { q: "IFRS stands for?", o: ["International Financial Reporting Standards", "Internal Financial Regulation System", "Indian Financial Reporting Standard", "International Fiscal Rules"], a: 0 }
        ];

        let currentQuestions = [];
        let score = 0;

        function startQuiz() {
            let shuffled = caBank.sort(() => 0.5 - Math.random());
            currentQuestions = shuffled.slice(0, 10);
            let html = '';
            currentQuestions.forEach((q, index) => {
                html += `<div class="question-box"><div class="q-text">${index + 1}. ${q.q}</div><div class="options">`;
                q.o.forEach((opt, optIndex) => {
                    html += `<label><input type="radio" name="q${index}" value="${optIndex}"> ${opt}</label>`;
                });
                html += `</div></div>`;
            });
            document.getElementById('questions-area').innerHTML = html;
        }

        function submitQuiz() {
            score = 0;
            for (let i = 0; i < currentQuestions.length; i++) {
                let selected = document.querySelector(`input[name="q${i}"]:checked`);
                if (selected && parseInt(selected.value) === currentQuestions[i].a) score++;
            }
            document.getElementById('result').style.display = 'block';
            document.getElementById('result').innerHTML = `✅ You scored ${score} out of 10!`;
        }
        startQuiz();
    </script>
</body>
</html>
